<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minimalist Todo App</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght=400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="todo-container">
        <h1>Todo List</h1>

        <div class="week-navigation-container">
            <div class="week-header">
                <button id="prev-week-btn" class="nav-btn" aria-label="이전 주">&lt;</button>
                <span id="month-display"></span>
                <button id="next-week-btn" class="nav-btn" aria-label="다음 주">&gt;</button>
            </div>
            <div id="weekly-calendar" class="weekly-calendar"></div>

            <div class="progress-container">
                <div class="progress-label">
                    <span>주간 달성률</span>
                    <span id="progress-percent">0%</span>
                </div>
                <div class="progress-bar-bg">
                    <div id="progress-bar-fill" class="progress-bar-fill"></div>
                </div>
            </div>
        </div>
        
        <form id="todo-form" class="todo-form">
            <select id="todo-category" class="category-select" aria-label="카테고리 선택">
                <option value="일상">일상</option>
                <option value="학업">학업</option>
                <option value="업무">업무</option>
                <option value="운동">운동</option>
            </select>
            <input type="text" id="todo-input" placeholder="할 일을 입력하세요..." autocomplete="off">
            <button type="submit" id="add-btn">추가</button>
        </form>

        <div class="filter-container">
            <div class="filter-tabs">
                <button class="tab-btn active" data-filter="all">전체</button>
                <button class="tab-btn" data-filter="active">진행</button>
                <button class="tab-btn" data-filter="completed">완료</button>
            </div>
            <select id="filter-category" class="filter-category-select" aria-label="카테고리 필터">
                <option value="all">모든 카테고리</option>
                <option value="일상">일상</option>
                <option value="학업">학업</option>
                <option value="업무">업무</option>
                <option value="운동">운동</option>
            </select>
        </div>
        
        <ul id="todo-list" class="todo-list"></ul>
    </div>
    
    <script src="app.js"></script>
</body>
</html>
